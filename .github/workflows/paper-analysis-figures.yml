name: Archive manuscript figures
on:
  push:
    paths:
      - 'benchmarks/paper-analysis/render_figures_from_summary.py'
      - '.github/workflows/paper-analysis-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'matplotlib>=3.7,<4'
      - name: Build Figures 3-6 from archived summary.csv
        run: python benchmarks/paper-analysis/render_figures_from_summary.py
      - name: Commit generated PNG figures to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/paper-analysis/results/fig3_throughput_vs_clients.png
          git add benchmarks/paper-analysis/results/fig4_latency_vs_clients.png
          git add benchmarks/paper-analysis/results/fig5_latency_vs_batchtimeout.png
          git add benchmarks/paper-analysis/results/fig6_throughput_vs_batchtimeout.png
          if git diff --cached --quiet; then
            echo 'Figure files are already present with matching generated contents'
          else
            git commit -m 'Archive manuscript figures 3-6 from analysis summary'
            git push origin HEAD:main
          fi
