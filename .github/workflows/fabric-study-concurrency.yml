name: Fabric research - baseline and concurrency (full protocol)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fabric-study-concurrency.yml'

concurrency:
  group: healthchain-study-concurrency
  cancel-in-progress: false

jobs:
  baseline-and-concurrency:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      FABRIC_VERSION: '2.5.4'
      FABRIC_BATCH_TIMEOUT_MS: '2000'
      FABRIC_MODE: fabric
      FABRIC_PEER_ENDPOINT: localhost:7051
      FABRIC_PEER_HOST_ALIAS: peer0.org1.example.com
      FABRIC_MSP_ID: Org1MSP
      FABRIC_CHANNEL: healthchannel
      FABRIC_CHAINCODE: healthchain
      FABRIC_BENCH_LEVELS: '1,2,5,10,20,50'
      FABRIC_BENCH_TX: '100'
      FABRIC_BENCH_ROUNDS: '10'
      FABRIC_BENCH_COOLDOWN_MS: '3000'
      FABRIC_BENCH_LABEL: 'research-shape-single-host-ephemeral-network'
      FABRIC_BENCH_OUTPUT: '../benchmarks/results'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact Fabric 2.5.4 and test network
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLsS https://raw.githubusercontent.com/hyperledger/fabric/main/scripts/install-fabric.sh -o install-fabric.sh
          bash install-fabric.sh --fabric-version 2.5.4 docker binary samples
          echo "FABRIC_SAMPLES=$RUNNER_TEMP/fabric-samples" >> "$GITHUB_ENV"
      - name: Capture machine characteristics
        shell: bash
        run: |
          mkdir -p benchmarks/results
          {
            echo "Fabric image version: 2.5.4"
            echo "Study: concurrency 1,2,5,10,20,50; ten rounds x 100; 3s cooldown"
            echo "Source commit: $GITHUB_SHA"
            echo "Date UTC: $(date -u +%FT%TZ)"
            echo "CPU:"
            lscpu
            echo "Memory:"
            free -h
            echo "Docker:"
            docker version
          } > benchmarks/results/host-environment.txt
      - name: Create Fabric channel with verified two-second BatchTimeout
        run: bash scripts/fabric-test-network.sh
      - name: Check chaincode workflows on live Fabric
        run: bash scripts/fabric-integration-test.sh
      - name: Run all six configurations on same Fabric deployment
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          ORG="$FABRIC_SAMPLES/test-network/organizations/peerOrganizations/org1.example.com"
          export FABRIC_TLS_CERT_PATH="$ORG/peers/peer0.org1.example.com/tls/ca.crt"
          export FABRIC_CERT_PATH
          FABRIC_CERT_PATH="$(find "$ORG/users/User1@org1.example.com/msp/signcerts" -maxdepth 1 -type f | head -n 1)"
          export FABRIC_KEY_PATH
          FABRIC_KEY_PATH="$(find "$ORG/users/User1@org1.example.com/msp/keystore" -maxdepth 1 -type f | head -n 1)"
          npm install --no-audit --no-fund
          npx ts-node --transpile-only scripts/live-fabric-performance.ts
      - name: Upload raw measurements and channel configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-concurrency-${{ github.run_id }}
          path: |
            benchmarks/results/fabric-live-*
            benchmarks/results/channel-config-*.json
            benchmarks/results/host-environment.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Export Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs peer0.org1.example.com --tail 80 || true
          docker logs peer0.org2.example.com --tail 80 || true
          docker logs orderer.example.com --tail 80 || true
      - name: Shut down the ephemeral network
        if: always()
        run: |
          if [ -f "$FABRIC_SAMPLES/test-network/network.sh" ]; then
            cd "$FABRIC_SAMPLES/test-network"
            ./network.sh down || true
          fi
