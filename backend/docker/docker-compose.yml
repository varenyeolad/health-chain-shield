version: '3.9'
services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: medchain-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://medchain:medchain@postgres:5432/medchain
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_SSL: "false"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      RECORDS_BUCKET: medchain-records
      FABRIC_MODE: mock
      KMS_MASTER_SEED: dev-seed-change-in-prod
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16
    container_name: medchain-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: medchain
      POSTGRES_PASSWORD: medchain
      POSTGRES_DB: medchain
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: medchain-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: medchain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
